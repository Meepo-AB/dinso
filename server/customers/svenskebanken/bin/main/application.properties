spring.application.name=dinso-svenskebanken
spring.profiles.active=company
spring.datasource.url=jdbc:h2:mem:svenskebanken;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
dinso.security.jwt-secret=dinso-svenskebanken-local-demo-signing-key
dinso.customer.portals=PRIVATE,COMPANY
dinso.customer.locales=sv,en
dinso.customer.default-locale=sv
dinso.customer.maximum-funds=10
dinso.customer.maximum-leave-months=18
dinso.customer.leave-reasons=PARENTAL_LEAVE,STUDIES
dinso.customer.show-fees=true
dinso.customer.show-transactions=true
dinso.customer.show-traditional-bonus-rate=true
dinso.customer.company-mutations=ADD_EMPLOYEE,CHANGE_SALARY,REGISTER_LEAVE,END_EMPLOYMENT
