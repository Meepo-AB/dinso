spring.application.name=dinso-pensionsbolaget
spring.profiles.active=company
spring.datasource.url=jdbc:h2:mem:pensionsbolaget;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
dinso.security.jwt-secret=dinso-pensionsbolaget-local-demo-signing-key
dinso.customer.portals=PRIVATE,COMPANY
dinso.customer.locales=sv,en
dinso.customer.default-locale=sv
dinso.customer.maximum-funds=5
dinso.customer.maximum-leave-months=12
dinso.customer.leave-reasons=PARENTAL_LEAVE
dinso.customer.show-fees=false
dinso.customer.show-transactions=false
dinso.customer.show-traditional-bonus-rate=true
dinso.customer.company-mutations=ADD_EMPLOYEE,CHANGE_SALARY,REGISTER_LEAVE,END_EMPLOYMENT
